# Large swarm for scaling experiments

num_agents: 500
topology: hierarchical
hidden_dim: 256
message_passing_rounds: 5

num_perception: 125
num_reasoning: 125
num_memory: 125
num_planning: 125

learning_rate: 0.00005
batch_size: 64
num_epochs: 200
device: cuda

