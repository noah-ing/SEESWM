[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seeswm"
version = "0.1.0"
description = "Research prototype for specialized neural agents, graph message passing, and checkpoint diagnostics in a simulated grid world"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Noah Ingwers"}
]
keywords = ["multi-agent-systems", "swarm-intelligence", "world-model", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.10.0,<3.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.urls]
Repository = "https://github.com/noah-ing/SEESWM"
Issues = "https://github.com/noah-ing/SEESWM/issues"
Security = "https://github.com/noah-ing/SEESWM/security"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]
analysis = [
    "scikit-learn>=1.2.0",
]
viz = [
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
    "tensorboard>=2.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
